# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: The Stochastic Gardener
email: ccoovrey@txstate.edu
description: > # this means to ignore newlines until "baseurl:"
  No perfect rows or mistakes, only experiments...
bio: PhD Student in Computer Science
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://ccoovrey.github.io" # the base hostname & protocol for your site
twitter_username: ccoovrey
github_username:  ccoovrey
linkedin_profile: chris-coovrey-9237a3a
paginate: 5
paginate_path: "/page/:num"

# Build settings
markdown: kramdown
sass:
  style: compressed

gems:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-mentions
  - jemoji
  - jekyll-seo-tag
  - jekyll-paginate

# exclusions
exclude: ['Gemfile', 'Gemfile.lock', 'vendor', 'Rakefile']
