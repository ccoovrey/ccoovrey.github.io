# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
#title: Your awesome title
title: Test Driven Intelligence
email: coov@tdintell.com
description: > # this means to ignore newlines until "baseurl:"
  For the care of a well behaved machine...
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://tdintell.com" # the base hostname & protocol for your site
twitter_username: ccoovrey
github_username:  ccoovrey
paginate: 5
paginate_path: "/page/:num"

# Build settings
markdown: kramdown
sass:
  style: compressed

gems:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-mentions
  - jemoji
  - jekyll-seo-tag
  - jekyll-paginate

# exclusions
exclude: ['Gemfile', 'Gemfile.lock', 'vendor', 'Rakefile']
